directory: /music
library: /data/beets-library.db

import:
  move: no
  copy: no
  write: yes
  timid: no
  incremental: no
  log: /data/beets-import.log
  quiet_fallback: skip
  # A re-download (better bitrate, more tracks) is the same album as one
  # beets imported before; -q would otherwise skip it untagged.
  duplicate_action: keep

match:
  # Distances, lower = closer. 0.04 is the beets default; anything looser
  # auto-applies wrong releases because import runs with -q (no prompts).
  strong_rec_thresh: 0.04
  preferred:
    countries: []
    media: []

plugins: fetchart embedart

fetchart:
  auto: yes

embedart:
  auto: yes
